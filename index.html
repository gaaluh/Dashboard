<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
<meta name="theme-color" content="#F6F7FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{
  --bg:#F6F7FB; --surface:#FFFFFF; --surface2:#EEF0F7; --line:#E3E6EF;
  --text:#14172B; --muted:#5B6178;
  --primary:#3346D3; --primary-soft:#E4E8FF; --on-primary:#FFFFFF;
  --green:#0B7A5C; --green-soft:#DDF5EC; --red:#C62F4B; --red-soft:#FDE6EA;
  --amber:#A15C00; --amber-soft:#FFF1DB;
  --hero:#1B2257; --hero-text:#FFFFFF; --hero-muted:#B9C0F0;
  --shadow:0 1px 2px rgba(20,23,43,.06),0 8px 24px rgba(20,23,43,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1120; --surface:#181B2E; --surface2:#22263D; --line:#2C3150;
    --text:#ECEEF8; --muted:#A3A9C4;
    --primary:#9AA8FF; --primary-soft:#2A3170; --on-primary:#0F1120;
    --green:#5FD4AE; --green-soft:#123A30; --red:#FF8FA3; --red-soft:#3D1A24;
    --amber:#FFC266; --amber-soft:#3A2A10;
    --hero:#252C6E; --hero-text:#FFFFFF; --hero-muted:#C4CAF5;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(96px + env(safe-area-inset-bottom))}

.appbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;justify-content:space-between}
.appbar h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.appbar p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.icon-btn:active{background:var(--surface2)}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.section{padding:0 20px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.section-title h2{margin:0;font-size:16px;font-weight:700}
.section-title button{font-size:13px;font-weight:700;color:var(--primary);padding:6px 0}

.hero{background:var(--hero);color:var(--hero-text);border-radius:28px;padding:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero small{color:var(--hero-muted);font-size:13px;font-weight:600}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:6px 0 18px}
.hero-split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-split div{background:rgba(255,255,255,.08);border-radius:16px;padding:12px}
.hero-split span{display:block;font-size:12px;color:var(--hero-muted);font-weight:600}
.hero-split b{display:block;font-size:15px;margin-top:4px}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.quick button{background:var(--surface);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:var(--shadow);font-weight:700;font-size:14px}
.quick .qi{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}

.list{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;padding:14px 16px;width:100%;text-align:left}
.item + .item{border-top:1px solid var(--line)}
button.item:active{background:var(--surface2)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.lead{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.item .body{flex:1;min-width:0}
.item .t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);margin-top:2px}
.item .r{text-align:right;flex-shrink:0}
.item .amt{font-weight:800;font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:4px}

.search{display:flex;align-items:center;gap:10px;height:50px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 8px 0 16px;color:var(--muted);margin-bottom:8px}
.search:focus-within{border-color:var(--primary)}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--text);min-width:0}
.search input::-webkit-search-cancel-button{display:none}
.search button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 6px;scrollbar-width:none}
.chip{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.seg{display:flex;background:var(--surface2);border-radius:16px;padding:4px}
.seg button{flex:1;min-height:40px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);padding:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum div{border-radius:20px;padding:16px}
.sum span{font-size:12px;font-weight:700}
.sum b{display:block;font-size:19px;margin-top:6px;letter-spacing:-.01em}

.empty{text-align:center;padding:36px 24px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:10px 8px calc(12px + env(safe-area-inset-bottom));z-index:30}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.nav .pill{width:64px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.nav button.on{color:var(--text);font-weight:800}
.nav button.on .pill{background:var(--primary-soft);color:var(--primary)}

.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:31;height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 6px 18px rgba(51,70,211,.35)}
.fab:active{transform:scale(.96)}

.scrim{position:fixed;inset:0;background:rgba(10,12,25,.45);z-index:50;animation:fade .2s}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;z-index:51;padding:10px 20px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.handle{width:36px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:800}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px 4px}
.field input,.field textarea{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px;font-size:15px;outline:none}
.field textarea{height:auto;padding:14px 16px;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.money{position:relative}
.money span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted)}
.money input{padding-left:46px;font-size:22px;font-weight:800;height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.toggle-row b{display:block;font-size:15px}.toggle-row small{color:var(--muted);font-size:13px}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch.on{background:var(--primary)}.switch.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;margin-bottom:14px;font-weight:600}
.stepper div{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--surface);font-size:20px;font-weight:700}
.stepper b{min-width:72px;text-align:center}
.btn{width:100%;height:56px;border-radius:18px;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface2);color:var(--text);margin-top:10px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{background:var(--bg);border-radius:20px;padding:18px 14px;text-align:left;font-weight:700}
.choice small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:4px}

.progres{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.progres span{display:block;height:100%;border-radius:6px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;position:relative}
.radio.on{border-color:var(--primary)}
.radio.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--primary)}
.kunci{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:calc(48px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.kunci-atas{text-align:center}
.kunci h1{margin:0 0 8px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.kunci p{margin:0;color:var(--muted);font-size:14px;font-weight:600;min-height:20px}
.kunci p.err{color:var(--red)}
.titik{display:flex;justify-content:center;gap:14px;margin-top:28px}
.titik span{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:background .1s}
.titik span.isi{background:var(--text);border-color:var(--text)}
.goyang{animation:goyang .35s}
@keyframes goyang{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:320px;width:100%;margin:0 auto}
.keypad button{height:68px;border-radius:24px;background:var(--surface);color:var(--text);font-size:26px;font-weight:700;box-shadow:var(--shadow);display:grid;place-items:center}
.keypad button:active{background:var(--surface2)}
.keypad button.fn{background:transparent;box-shadow:none;color:var(--muted)}
.keypad button.ok{background:var(--primary);color:var(--on-primary)}
.keypad button:disabled{opacity:.4}
.terkunci-isi{visibility:hidden}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom));z-index:60;background:#1F2235;color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;font-weight:600;width:calc(100% - 40px);max-width:440px;animation:fade .2s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.snack.err{background:#8E1F35}

.skeleton{height:64px;border-radius:16px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
button:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const { useState, useEffect, useMemo } = React;
const html = htm.bind(React.createElement);

/* ---------- Ikon ---------- */
const P = {
  home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM8 7h8M8 11h6',
  wallet:'M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h.01',
  plus:'M12 5v14M5 12h14',
  refresh:'M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5',
  bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',
  wrench:'M14.7 6.3a4 4 0 0 0 5 5L22 14l-8 8-2.3-2.3a4 4 0 0 0-5-5L4.4 12.4 12.4 4.4z',
  check:'M20 6 9 17l-5-5',
  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',
  x:'M18 6 6 18M6 6l12 12',
  edit:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
  lock:'M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4',
  back:'M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM17 9l-6 6M11 9l6 6',
  trash:'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14'
};
const Icon = ({ n, s = 22 }) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${P[n]}/></svg>`;

/* ---------- Utilitas ---------- */
const today = () => new Date().toLocaleDateString('sv-SE');
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const rpShort = n => { n = Number(n||0); if (n >= 1e9) return 'Rp ' + (n/1e9).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' M'; if (n >= 1e6) return 'Rp ' + (n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1}) + ' jt'; if (n >= 1e3) return 'Rp ' + Math.round(n/1e3) + ' rb'; return rp(n); };
const fmtTgl = s => { if (!s || s === '-') return '-'; const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };
const sisaHari = s => { if (!s || s === '-') return null; const [y,m,d] = s.split('-').map(Number); const t = new Date(); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); };
const labelSisa = n => n === null ? '' : n < 0 ? `Lewat ${-n} hari` : n === 0 ? 'Hari ini' : n === 1 ? 'Besok' : `${n} hari lagi`;
const formatAngka = v => v.replace(/\D/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const inisial = s => String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

/* ---------- Sambungan ke Apps Script ---------- */
// GANTI dengan URL Web App Apps Script Anda (berakhiran /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbzkQDLx-xm0o2YIZK-55cn4ZTFQBEfK1rm7I59BnYACoaCKlOFwTLPP-fYvXgVhzxOWHQ/exec';

const DEMO = {
  logbook:[{id:'1',tanggal:'2026-10-10',kejadian:'Ganti Mesin',deskripsi:'',rutin:true,siklus:'4 bulan',jatuhTempo:'2027-02-10',status:'Belum'}],
  hutang:[{id:'2',tanggal:'2026-11-10',nama:'Lege',jenis:'Piutang',nominal:50000000,keterangan:'',status:'Belum Lunas',jatuhTempo:'2026-11-27'}]
};
// PIN hanya disimpan di memori selama aplikasi terbuka. Di HP hanya tersimpan versi tersandi (hash).
let PIN_MEM = '';
const DEMO_MODE = API_URL.indexOf('TEMPEL') === 0;
const ambilPin = () => PIN_MEM;
const ls = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
ls.set('pin', null);   // bersihkan PIN versi lama yang tersimpan apa adanya
async function hashPin(p) {
  if (!(window.crypto && crypto.subtle)) return null;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dashboard-personal:' + p));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const lupakanPin = () => { PIN_MEM = ''; ls.set('pin_hash', null); ls.set('pin_len', null); };

const bacaCache = () => { try { return JSON.parse(localStorage.getItem('cache_data') || 'null'); } catch (e) { return null; } };
const simpanCache = d => { try { d ? localStorage.setItem('cache_data', JSON.stringify(d)) : localStorage.removeItem('cache_data'); } catch (e) {} };

async function server(fn, ...args) {
  if (API_URL.indexOf('TEMPEL') === 0) { await new Promise(r => setTimeout(r, 400)); return fn === 'getData' ? DEMO : 'OK'; }
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ pin: ambilPin(), action: fn, args }) });
    j = await r.json();
  } catch (e) {
    throw 'Tidak bisa terhubung. Periksa internet Anda.';
  }
  if (!j.ok) {
    if (j.code === 'PIN') { lupakanPin(); simpanCache(null); window.dispatchEvent(new Event('pin-salah')); }
    throw j.error;
  }
  return j.data;
}

/* ---------- Komponen ---------- */
function Sheet({ onClose, children }) {
  return html`<div>
    <div className="scrim" onClick=${onClose}></div>
    <div className="sheet" role="dialog" aria-modal="true"><div className="handle"></div>${children}</div>
  </div>`;
}

function HutangItem({ h, onTap }) {
  const piutang = h.jenis === 'Piutang';
  const n = h.status === 'Belum Lunas' ? sisaHari(h.jatuhTempo) : null;
  const tone = n === null ? null : n < 0 ? ['var(--red-soft)','var(--red)'] : n <= 3 ? ['var(--amber-soft)','var(--amber)'] : ['var(--surface2)','var(--muted)'];
  const Tag = onTap ? 'button' : 'div';
  return html`<${Tag} className="item" onClick=${onTap ? () => onTap(h) : undefined}>
    <div className="avatar" style=${{background: piutang ? 'var(--green-soft)' : 'var(--red-soft)', color: piutang ? 'var(--green)' : 'var(--red)'}}>${inisial(h.nama)}</div>
    <div className="body">
      <div className="t">${h.nama}</div>
      <div className="s">${piutang ? 'Meminjam dari Anda' : 'Anda meminjam'}${h.keterangan ? ', ' + h.keterangan : ''}</div>
    </div>
    <div className="r">
      <div className="amt" style=${{color: piutang ? 'var(--green)' : 'var(--red)'}}>${piutang ? '+' : '−'}${rpShort(h.status === 'Lunas' ? h.nominal : sisaOf(h))}</div>
      ${h.status === 'Lunas' ? html`<span className="badge" style=${{background:'var(--surface2)',color:'var(--muted)'}}>Lunas</span>`
        : tone && html`<span className="badge" style=${{background:tone[0],color:tone[1]}}>${labelSisa(n)}</span>`}
    </div>
  </${Tag}>`;
}

const teksSiklus = s => s === 'sekali' ? 'Sekali' : s === '1 hari' ? 'Setiap hari' : 'Tiap ' + String(s || '').replace('bulan', 'bln');

function LogItem({ l, onTap }) {
  const n = l.rutin ? sisaHari(l.jatuhTempo) : null;
  const Tag = onTap ? 'button' : 'div';
  return html`<${Tag} className="item" onClick=${onTap ? () => onTap(l) : undefined}>
    <div className="lead" style=${{background:'var(--primary-soft)',color:'var(--primary)'}}><${Icon} n=${l.rutin ? 'bell' : 'wrench'}/></div>
    <div className="body">
      <div className="t">${l.kejadian}</div>
      <div className="s">${!l.rutin ? `Dicatat ${fmtTgl(l.tanggal)}` : l.siklus === 'sekali' ? (l.status === 'Sudah' ? 'Alarm sudah lewat' : `Alarm ${fmtTgl(l.jatuhTempo)}`) : `Berikutnya ${fmtTgl(l.jatuhTempo)}`}</div>
    </div>
    ${l.rutin && html`<div className="r"><span className="badge" style=${{background:'var(--primary-soft)',color:'var(--primary)'}}>${teksSiklus(l.siklus)}</span>
      ${n !== null && n >= 0 && n <= 14 && l.status !== 'Sudah' && html`<div className="s" style=${{marginTop:4}}>${labelSisa(n)}</div>`}</div>`}
  </${Tag}>`;
}

const Empty = ({ title, text }) => html`<div className="empty"><b>${title}</b>${text}</div>`;
const Spinner = () => html`<span className="spin" style=${{display:'grid'}}><${Icon} n="refresh" s=${20}/></span>`;

      </div>
      ${sendiri && html`<div className="row2" style=${{marginTop:12}}>

    </div>`}
    <button className="btn" disabled=${saving}>${saving ? html`<${Spinner}/> Menyimpan…` : edit ? 'Simpan perubahan' : 'Simpan catatan'}</button>

/* ---------- Halaman ---------- */
const sisaOf = h => h.sisa != null ? h.sisa : h.nominal;
const dibayarOf = h => h.dibayar || 0;
const Progres = ({ h, warna }) => {
  const pct = h.nominal ? Math.min(100, Math.round(dibayarOf(h) / h.nominal * 100)) : 0;
  return html`<div className="progres" role="progressbar" aria-valuenow=${pct} aria-valuemin="0" aria-valuemax="100" aria-label="Sudah dibayar">
    <span style=${{width: pct + '%', background: warna}}></span></div>`;
};

function hitung(data) {
  const aktif = data.hutang.filter(h => h.status === 'Belum Lunas');
  const piutang = aktif.filter(h => h.jenis === 'Piutang').reduce((a, h) => a + sisaOf(h), 0);
  const hutang = aktif.filter(h => h.jenis === 'Hutang').reduce((a, h) => a + sisaOf(h), 0);
  return { aktif, piutang, hutang };
}

function Beranda({ data, go, openForm, onTapHutang, onTapLog }) {
  const { aktif, piutang, hutang } = hitung(data);
  const saldo = piutang - hutang;
  const perhatianH = aktif.filter(h => { const n = sisaHari(h.jatuhTempo); return n !== null && n <= 7; })
    .sort((a, b) => sisaHari(a.jatuhTempo) - sisaHari(b.jatuhTempo));
  const perhatianL = data.logbook.filter(l => { const n = l.rutin ? sisaHari(l.jatuhTempo) : null; return n !== null && n <= 7; });
  const berikut = data.logbook.filter(l => l.rutin).sort((a, b) => a.jatuhTempo.localeCompare(b.jatuhTempo)).slice(0, 3);

  return html`<div>
    <div className="section">
      <div className="hero">
        <small>Posisi bersih Anda</small>
        <div className="big">${saldo < 0 ? '−' : ''}${rp(Math.abs(saldo))}</div>
        <div className="hero-split">
          <div><span>Akan diterima</span><b>${rp(piutang)}</b></div>
          <div><span>Harus dibayar</span><b>${rp(hutang)}</b></div>
        </div>
      </div>
      <div className="quick">
        <button onClick=${() => openForm('logbook')}><span className="qi" style=${{background:'var(--primary-soft)',color:'var(--primary)'}}><${Icon} n="book"/></span>Catatan baru</button>
        <button onClick=${() => openForm('hutang')}><span className="qi" style=${{background:'var(--green-soft)',color:'var(--green)'}}><${Icon} n="wallet"/></span>Catat pinjaman</button>
      </div>
    </div>

    <div className="section">
      <div className="section-title"><h2>Perlu perhatian</h2></div>
      ${perhatianH.length + perhatianL.length === 0
        ? html`<div className="list"><${Empty} title="Semua aman" text="Tidak ada jatuh tempo dalam 7 hari ke depan."/></div>`
        : html`<div className="list">
            ${perhatianH.map(h => html`<${HutangItem} key=${h.id} h=${h} onTap=${onTapHutang}/>`)}
            ${perhatianL.map(l => html`<${LogItem} key=${l.id} l=${l} onTap=${onTapLog}/>`)}
          </div>`}
    </div>

    <div className="section">
      <div className="section-title"><h2>Rutinitas berikutnya</h2><button onClick=${() => go('logbook')}>Lihat semua</button></div>
      ${berikut.length === 0
        ? html`<div className="list"><${Empty} title="Belum ada rutinitas" text="Nyalakan “Ingatkan saya” saat membuat catatan."/></div>`
        : html`<div className="list">${berikut.map(l => html`<${LogItem} key=${l.id} l=${l} onTap=${onTapLog}/>`)}</div>`}
    </div>
  </div>`;
}

function Logbook({ data, onTap }) {
  const [filter, setFilter] = useState('Semua');
  const [cari, setCari] = useState('');
  const list = useMemo(() => {
    const q = cari.trim().toLowerCase();
    return data.logbook
      .filter(l => filter === 'Semua' || (filter === 'Rutin' ? l.rutin : !l.rutin))
      .filter(l => !q || (String(l.kejadian) + ' ' + String(l.deskripsi || '')).toLowerCase().indexOf(q) !== -1)
      .sort((a, b) => b.tanggal.localeCompare(a.tanggal));
  }, [data, filter, cari]);
  return html`<div>
    <div className="section">
      <div className="search">
        <${Icon} n="search" s=${20}/>
        <input type="search" placeholder="Cari catatan…" aria-label="Cari catatan" value=${cari} onChange=${e => setCari(e.target.value)}/>
        ${cari && html`<button aria-label="Hapus pencarian" onClick=${() => setCari('')}><${Icon} n="x" s=${18}/></button>`}
      </div>
    </div>
    <div className="chips">${['Semua','Rutin','Sekali'].map(c => html`<button key=${c} className=${'chip' + (filter === c ? ' on' : '')} onClick=${() => setFilter(c)}>${c}</button>`)}</div>
    <div className="section" style=${{marginTop:12}}>
      ${list.length === 0
        ? html`<div className="list">${cari
            ? html`<${Empty} title="Tidak ditemukan" text=${'Tidak ada catatan yang cocok dengan “' + cari + '”.'}/>`
            : html`<${Empty} title="Belum ada catatan" text="Ketuk Tambah untuk mencatat yang pertama."/>`}</div>`
        : html`<div className="list">${list.map(l => html`<${LogItem} key=${l.id} l=${l} onTap=${onTap}/>`)}</div>`}
      ${list.length > 0 && html`<p style=${{textAlign:'center',fontSize:13,color:'var(--muted)',margin:'14px 0'}}>Ketuk catatan untuk mengedit</p>`}
    </div>
  </div>`;
}

// Mengelompokkan pinjaman per orang (nama sama + jenis sama = dijumlahkan)
function kelompokkan(hutang, lunas) {
  const map = {};
  hutang.filter(h => lunas ? h.status === 'Lunas' : h.status !== 'Lunas').forEach(h => {
    const key = h.jenis + '|' + String(h.nama).trim().toLowerCase();
    if (!map[key]) map[key] = { key, nama: String(h.nama).trim(), jenis: h.jenis, items: [], total: 0, jt: null };
    const g = map[key];
    g.items.push(h); g.total += lunas ? h.nominal : sisaOf(h);
    if (h.jatuhTempo && (!g.jt || h.jatuhTempo < g.jt)) g.jt = h.jatuhTempo;
  });
  return Object.values(map).map(g => ({ ...g, items: g.items.sort((a, b) => a.tanggal.localeCompare(b.tanggal)) }))
    .sort((a, b) => (a.jt || '9999').localeCompare(b.jt || '9999'));
}

function OrangItem({ g, onTap, lunas }) {
  const piutang = g.jenis === 'Piutang';
  const n = lunas ? null : sisaHari(g.jt);
  const tone = n === null ? null : n < 0 ? ['var(--red-soft)','var(--red)'] : n <= 3 ? ['var(--amber-soft)','var(--amber)'] : ['var(--surface2)','var(--muted)'];
  return html`<button className="item" onClick=${() => onTap(g)}>
    <div className="avatar" style=${{background: piutang ? 'var(--green-soft)' : 'var(--red-soft)', color: piutang ? 'var(--green)' : 'var(--red)'}}>${inisial(g.nama)}</div>
    <div className="body">
      <div className="t">${g.nama}</div>
      <div className="s">${piutang ? 'Meminjam dari Anda' : 'Anda meminjam'}, ${g.items.length} kali</div>
    </div>
    <div className="r">
      <div className="amt" style=${{color: piutang ? 'var(--green)' : 'var(--red)'}}>${piutang ? '+' : '−'}${rpShort(g.total)}</div>
      ${lunas ? html`<span className="badge" style=${{background:'var(--surface2)',color:'var(--muted)'}}>Lunas</span>`
        : tone && html`<span className="badge" style=${{background:tone[0],color:tone[1]}}>${labelSisa(n)}</span>`}
    </div>
  </button>`;
}

function Keuangan({ data, onTapOrang }) {
  const [tab, setTab] = useState('aktif');
  const [cari, setCari] = useState('');
  const { piutang, hutang } = hitung(data);
  const q = cari.trim().toLowerCase();
  const list = kelompokkan(data.hutang, tab === 'lunas').filter(g => !q || g.nama.toLowerCase().indexOf(q) !== -1);
  return html`<div className="section">
    <div className="sum">
      <div style=${{background:'var(--green-soft)'}}><span style=${{color:'var(--green)'}}>Akan diterima</span><b style=${{color:'var(--green)'}}>${rp(piutang)}</b></div>
      <div style=${{background:'var(--red-soft)'}}><span style=${{color:'var(--red)'}}>Harus dibayar</span><b style=${{color:'var(--red)'}}>${rp(hutang)}</b></div>
    </div>
    <div className="seg" style=${{margin:'16px 0 12px'}}>
      <button className=${tab === 'aktif' ? 'on' : ''} onClick=${() => setTab('aktif')}>Belum lunas</button>
      <button className=${tab === 'lunas' ? 'on' : ''} onClick=${() => setTab('lunas')}>Lunas</button>
    </div>
    <div className="search">
      <${Icon} n="search" s=${20}/>
      <input type="search" placeholder="Cari nama…" aria-label="Cari nama" value=${cari} onChange=${e => setCari(e.target.value)}/>
      ${cari && html`<button aria-label="Hapus pencarian" onClick=${() => setCari('')}><${Icon} n="x" s=${18}/></button>`}
    </div>
    ${list.length === 0
      ? html`<div className="list"><${Empty} title=${q ? 'Tidak ditemukan' : tab === 'lunas' ? 'Belum ada yang lunas' : 'Tidak ada pinjaman aktif'} text=${q ? 'Tidak ada nama yang cocok.' : tab === 'lunas' ? 'Pinjaman yang ditandai lunas muncul di sini.' : 'Ketuk Tambah untuk mencatat pinjaman.'}/></div>`
      : html`<div className="list">${list.map(g => html`<${OrangItem} key=${g.key} g=${g} lunas=${tab === 'lunas'} onTap=${g => onTapOrang(g.key, tab === 'lunas')}/>`)}</div>`}
  </div>`;
}

function Orang({ g, lunas, saving, onTapItem, onTambah, onLunasSemua, onBayar }) {
  const [yakin, setYakin] = useState(false);
  if (!g) return html`<div><h3>Data tidak ditemukan</h3><${Empty} title="" text="Mungkin sudah lunas atau dihapus."/></div>`;
  const piutang = g.jenis === 'Piutang';
  const warna = piutang ? 'var(--green)' : 'var(--red)';
  return html`<div>
    <div style=${{display:'flex',alignItems:'center',gap:14,marginBottom:16}}>
      <div className="avatar" style=${{width:56,height:56,fontSize:20,background: piutang ? 'var(--green-soft)' : 'var(--red-soft)', color: warna}}>${inisial(g.nama)}</div>
      <div><h3 style=${{margin:0}}>${g.nama}</h3><div style=${{color:'var(--muted)',fontSize:14}}>${piutang ? 'Meminjam dari Anda' : 'Anda meminjam'}</div></div>
    </div>
    <div style=${{background: piutang ? 'var(--green-soft)' : 'var(--red-soft)', borderRadius:20, padding:16, marginBottom:16}}>
      <span style=${{fontSize:12,fontWeight:700,color:warna}}>${lunas ? 'Total yang sudah lunas' : piutang ? 'Total yang belum dikembalikan' : 'Total yang belum Anda bayar'}</span>
      <b style=${{display:'block',fontSize:24,marginTop:4,color:warna}}>${rp(g.total)}</b>
    </div>
    <div className="list" style=${{boxShadow:'none',background:'var(--bg)',marginBottom:16}}>
      ${g.items.map((h, i) => {
        const n = lunas ? null : sisaHari(h.jatuhTempo);
        return html`<button key=${h.id} className="item" onClick=${() => onTapItem(h)}>
          <div className="lead" style=${{background:'var(--surface)',color:'var(--muted)',fontWeight:800}}>${i + 1}</div>
          <div className="body">
            <div className="t">${fmtTgl(h.tanggal)}</div>
            <div className="s">${!lunas && dibayarOf(h) ? 'Dibayar ' + rp(dibayarOf(h)) + ' dari ' + rp(h.nominal) : h.keterangan || (h.jatuhTempo ? 'Jatuh tempo ' + fmtTgl(h.jatuhTempo) : 'Tanpa jatuh tempo')}</div>
            ${!lunas && dibayarOf(h) > 0 && html`<${Progres} h=${h} warna=${warna}/>`}
          </div>
          <div className="r"><div className="amt">${rp(lunas ? h.nominal : sisaOf(h))}</div>
            ${!lunas && dibayarOf(h) > 0 && html`<div className="s">sisa</div>`}
            ${n !== null && html`<div className="s" style=${{color: n < 0 ? 'var(--red)' : n <= 3 ? 'var(--amber)' : 'var(--muted)'}}>${labelSisa(n)}</div>`}</div>
        </button>`;
      })}
    </div>
    ${!lunas && html`<div>
      <button className="btn" onClick=${() => onBayar(g)}><${Icon} n="wallet"/> Catat pembayaran</button>
      <button className="btn ghost" onClick=${() => onTambah(g)}><${Icon} n="plus"/> Tambah pinjaman ${g.nama}</button>
      ${g.items.length > 1 && (yakin
        ? html`<button className="btn ghost" style=${{background:warna,color:'#fff'}} disabled=${saving} onClick=${() => onLunasSemua(g)}>${saving ? 'Menyimpan…' : 'Ya, lunasi semua ' + rp(g.total)}</button>`
        : html`<button className="btn ghost" onClick=${() => setYakin(true)}><${Icon} n="check"/> Lunasi semua</button>`)}
    </div>`}
    <p style=${{textAlign:'center',fontSize:13,color:'var(--muted)',margin:'14px 0 0'}}>Ketuk salah satu pinjaman untuk melihat riwayat pembayaran, melunasi, atau mengedit</p>
  </div>`;
}

function Detail({ h, saving, onLunas, onEdit, onClose, onBayar, onEditBayar }) {
  const piutang = h.jenis === 'Piutang';
  const lunas = h.status === 'Lunas';
  const warna = piutang ? 'var(--green)' : 'var(--red)';
  const riwayat = h.pembayaran || [];
  const Row = (k, v, color) => html`<div className="item"><div className="body"><div className="s">${k}</div><div className="t" style=${{color, whiteSpace:'normal'}}>${v}</div></div></div>`;
  return html`<div>
    <h3>${h.nama}, ${fmtTgl(h.tanggal)}</h3>
    <div style=${{background: piutang ? 'var(--green-soft)' : 'var(--red-soft)', borderRadius:20, padding:16, marginBottom:16}}>
      <span style=${{fontSize:12,fontWeight:700,color:warna}}>${lunas ? 'Lunas' : 'Sisa yang belum dibayar'}</span>
      <b style=${{display:'block',fontSize:24,margin:'4px 0 10px',color:warna}}>${rp(lunas ? 0 : sisaOf(h))}</b>
      <${Progres} h=${lunas ? { ...h, dibayar: h.nominal } : h} warna=${warna}/>
      <div style=${{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:600,color:warna,marginTop:8}}>
        <span>Dibayar ${rp(dibayarOf(h))}</span><span>Pinjaman ${rp(h.nominal)}</span>
      </div>
    </div>
    <div className="list" style=${{boxShadow:'none',background:'var(--bg)',marginBottom:16}}>
      ${Row('Jenis', piutang ? 'Meminjam dari Anda' : 'Anda meminjam')}
      ${Row('Jatuh tempo', h.jatuhTempo ? fmtTgl(h.jatuhTempo) + (lunas ? '' : ' (' + labelSisa(sisaHari(h.jatuhTempo)) + ')') : 'Tidak diatur')}
      ${h.keterangan ? Row('Keterangan', h.keterangan) : null}
    </div>
    <div className="section-title" style=${{marginTop:0}}><h2>Riwayat pembayaran</h2></div>
    <div className="list" style=${{boxShadow:'none',background:'var(--bg)',marginBottom:16}}>
      ${riwayat.length === 0
        ? html`<div className="empty" style=${{padding:'20px'}}>Belum ada pembayaran.</div>`
        : riwayat.map((p, i) => html`<button key=${p.id} className="item" onClick=${() => onEditBayar(p, h)}>
            <div className="lead" style=${{background:'var(--surface)',color:warna}}><${Icon} n="check" s=${20}/></div>
            <div className="body"><div className="t">Cicilan ${i + 1}</div><div className="s">${fmtTgl(p.tanggal)}${p.catatan ? ', ' + p.catatan : ''}</div></div>
            <div className="r"><div className="amt" style=${{color:warna}}>${rp(p.nominal)}</div></div>
          </button>`)}
    </div>
    ${!lunas && html`<button className="btn" onClick=${() => onBayar(h)}><${Icon} n="wallet"/> Catat pembayaran</button>`}
    ${!lunas && html`<button className="btn ghost" disabled=${saving} onClick=${onLunas}>${saving ? 'Menyimpan…' : html`<${Icon} n="check"/> Tandai lunas (tanpa pembayaran)`}</button>`}
    <button className="btn ghost" onClick=${onEdit}><${Icon} n="edit" s=${20}/> Edit pinjaman</button>
    <button className="btn ghost" onClick=${onClose}>Tutup</button>
  </div>`;
}

function FormBayar({ pilihan: semua, idAwal, awal, onSave, onDelete, saving }) {
  const pilihan = [...semua].sort((a, b) => a.tanggal.localeCompare(b.tanggal));
  const edit = !!(awal && awal.id);
  const [f, setF] = useState(edit
    ? { kategori:'bayar', id: awal.id, idPinjaman: awal.idPinjaman, tanggal: awal.tanggal, nominal: formatAngka(String(awal.nominal)), catatan: awal.catatan || '' }
    : { kategori:'bayar', idPinjaman: idAwal || (pilihan.length === 1 ? pilihan[0].id : ''), tanggal: today(), nominal:'', catatan:'' });
  const [yakinHapus, setYakinHapus] = useState(false);
  const set = (k, v) => setF(o => ({ ...o, [k]: v }));
  const dipilih = pilihan.find(h => h.id === f.idPinjaman);
  const batas = dipilih ? sisaOf(dipilih) + (edit ? Number(awal.nominal) : 0) : 0;
  const nilai = Number(String(f.nominal).replace(/\./g, '')) || 0;
  const lebih = dipilih && nilai > batas;
  return html`<form onSubmit=${e => { e.preventDefault(); if (!f.idPinjaman || lebih) return; onSave(f); }}>
    <h3>${edit ? 'Edit pembayaran' : 'Catat pembayaran'}</h3>
    ${!edit && pilihan.length > 1 && html`<div className="field"><label>Pinjaman yang dibayar</label>
      <div className="list" style=${{boxShadow:'none',background:'var(--bg)'}} role="radiogroup">
        ${pilihan.map(h => html`<button type="button" key=${h.id} role="radio" aria-checked=${f.idPinjaman === h.id} className="item" onClick=${() => set('idPinjaman', h.id)}>
          <span className=${'radio' + (f.idPinjaman === h.id ? ' on' : '')}></span>
          <div className="body"><div className="t">Pinjaman ${fmtTgl(h.tanggal)}</div><div className="s">${rp(h.nominal)}${h.keterangan ? ', ' + h.keterangan : ''}</div></div>
          <div className="r"><div className="amt">${rp(sisaOf(h))}</div><div className="s">sisa</div></div>
        </button>`)}
      </div></div>`}
    ${dipilih && (edit || pilihan.length === 1) && html`<p style=${{margin:'0 4px 14px',color:'var(--muted)',fontSize:14}}>Pinjaman ${fmtTgl(dipilih.tanggal)}, sisa ${rp(sisaOf(dipilih))}</p>`}
    <div className="field"><label htmlFor="jb">Jumlah dibayar</label>
      <div className="money"><span>Rp</span><input id="jb" inputMode="numeric" required placeholder="0" value=${f.nominal} onChange=${e => set('nominal', formatAngka(e.target.value))}/></div>
      ${dipilih && html`<div style=${{display:'flex',gap:8,marginTop:8,alignItems:'center',flexWrap:'wrap'}}>
        <button type="button" className="chip" onClick=${() => set('nominal', formatAngka(String(batas)))}>Bayar penuh ${rp(batas)}</button>
        ${lebih && html`<span style=${{color:'var(--red)',fontSize:13,fontWeight:600}}>Melebihi sisa pinjaman</span>`}
      </div>`}</div>
    <div className="field"><label htmlFor="tb">Tanggal bayar</label><input id="tb" type="date" required value=${f.tanggal} onChange=${e => set('tanggal', e.target.value)}/></div>
    <div className="field"><label htmlFor="cb">Catatan (opsional)</label><input id="cb" value=${f.catatan} onChange=${e => set('catatan', e.target.value)} placeholder="Contoh: transfer BCA"/></div>
    <button className="btn" disabled=${saving || !f.idPinjaman || lebih}>${saving ? html`<${Spinner}/> Menyimpan…` : !f.idPinjaman ? 'Pilih pinjaman dulu' : edit ? 'Simpan perubahan' : 'Simpan pembayaran'}</button>
    ${edit && (yakinHapus
      ? html`<button type="button" className="btn ghost" style=${{background:'var(--red)',color:'#fff'}} disabled=${saving} onClick=${() => onDelete(f)}>Ya, hapus pembayaran ini</button>`
      : html`<button type="button" className="btn ghost" style=${{color:'var(--red)'}} onClick=${() => setYakinHapus(true)}><${Icon} n="trash" s=${20}/> Hapus pembayaran</button>`)}
  </form>`;
}

/* ---------- Layar PIN ---------- */
function LayarPin({ onMasuk, pesan, memeriksa }) {
  const [pin, setPin] = useState('');
  const [salahLokal, setSalahLokal] = useState(0);
  const [tungguSampai, setTungguSampai] = useState(0);
  const [, setDetik] = useState(0);
  const [goyang, setGoyang] = useState(false);
  const panjang = Number(ls.get('pin_len')) || 0;
  const tunggu = Math.max(0, Math.ceil((tungguSampai - Date.now()) / 1000));

  useEffect(() => { if (!tunggu) return; const t = setInterval(() => setDetik(x => x + 1), 1000); return () => clearInterval(t); }, [tungguSampai, tunggu > 0]);

  const kirim = async p => {
    if (!p || tunggu || memeriksa) return;
    const hasil = await onMasuk(p);
    if (hasil === false) {
      const n = salahLokal + 1;
      setSalahLokal(n); setPin(''); setGoyang(true); setTimeout(() => setGoyang(false), 400);
      if (n % 5 === 0) setTungguSampai(Date.now() + 30000);
    }
  };
  const tekan = k => {
    if (tunggu || memeriksa) return;
    if (k === 'hapus') return setPin(p => p.slice(0, -1));
    if (k === 'ok') return kirim(pin);
    if (pin.length >= 12) return;
    const baru = pin + k;
    setPin(baru);
    if (panjang && baru.length === panjang) setTimeout(() => kirim(baru), 120);
  };

  useEffect(() => {
    const h = e => { if (/^[0-9]$/.test(e.key)) tekan(e.key); else if (e.key === 'Backspace') tekan('hapus'); else if (e.key === 'Enter') tekan('ok'); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });

  const titik = panjang || Math.max(4, pin.length);
  const info = tunggu ? `Terlalu banyak percobaan. Tunggu ${tunggu} detik.`
    : memeriksa ? 'Memeriksa PIN…'
    : salahLokal ? 'PIN salah. Coba lagi.'
    : pesan || (panjang ? 'Masukkan PIN Anda' : 'Masukkan PIN, lalu ketuk ✓');

  return html`<div className="kunci" role="dialog" aria-modal="true" aria-label="Masukkan PIN">
    <div className="kunci-atas">
      <div className="lead" style=${{background:'var(--primary-soft)',color:'var(--primary)',width:60,height:60,borderRadius:20,margin:'0 auto 16px'}}><${Icon} n="lock" s=${28}/></div>
      <h1>Dashboard Personal</h1>
      <p className=${salahLokal || pesan || tunggu ? 'err' : ''} role="status">${info}</p>
      <div className=${'titik' + (goyang ? ' goyang' : '')} aria-hidden="true">
        ${Array.from({ length: titik }, (_, i) => html`<span key=${i} className=${i < pin.length ? 'isi' : ''}></span>`)}
      </div>
    </div>
    <div className="keypad">
      ${['1','2','3','4','5','6','7','8','9','hapus','0','ok'].map(k => html`<button key=${k} type="button"
          aria-label=${k === 'hapus' ? 'Hapus' : k === 'ok' ? 'Buka' : k}
          className=${k === 'ok' ? 'ok' : k === 'hapus' ? 'fn' : ''}
          disabled=${!!tunggu || memeriksa || (k === 'ok' && !pin)}
          onClick=${() => tekan(k)}>
          ${k === 'hapus' ? html`<${Icon} n="back" s=${24}/>` : k === 'ok' ? (memeriksa ? html`<${Spinner}/>` : html`<${Icon} n="check" s=${24}/>`) : k}
        </button>`)}
    </div>
  </div>`;
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState('beranda');
  const [data, setData] = useState(() => DEMO_MODE ? null : bacaCache());
  const [loading, setLoading] = useState(true);
  const [sheet, setSheet] = useState(null);
  const [saving, setSaving] = useState(false);
  const [snack, setSnack] = useState(null);
  const [terkunci, setTerkunci] = useState(!DEMO_MODE);
  const [pesanPin, setPesanPin] = useState('');
  const [memeriksa, setMemeriksa] = useState(false);

  // PIN salah / diganti di server → kunci dan minta PIN terbaru
  useEffect(() => {
    const h = () => { setTerkunci(true); setSheet(null); setPesanPin('PIN salah atau sudah diganti. Masukkan PIN terbaru.'); setData(null); };
    window.addEventListener('pin-salah', h);
    return () => window.removeEventListener('pin-salah', h);
  }, []);

  // Kunci otomatis setiap aplikasi ditinggalkan (pindah ke WhatsApp, layar utama, dll.)
  useEffect(() => {
    if (DEMO_MODE) return;
    const kunci = () => { if (document.visibilityState === 'hidden') { PIN_MEM = ''; setPesanPin(''); setTerkunci(true); } };
    document.addEventListener('visibilitychange', kunci);
    window.addEventListener('pagehide', kunci);
    return () => { document.removeEventListener('visibilitychange', kunci); window.removeEventListener('pagehide', kunci); };
  }, []);

  // Membuka kunci: cocokkan dengan hash di HP (instan). Pertama kali: cek ke server.
  const masuk = async p => {
    const hashTersimpan = ls.get('pin_hash');
    const h = await hashPin(p);
    if (hashTersimpan && h) {
      if (h !== hashTersimpan) return false;
      PIN_MEM = p; setPesanPin(''); setTerkunci(false);
      return true;
    }
    setMemeriksa(true);
    PIN_MEM = p;
    try {
      const d = await server('getData');
      if (h) { ls.set('pin_hash', h); ls.set('pin_len', String(p.length)); }
      setData(d); simpanCache(d); setPesanPin(''); setTerkunci(false);
      return true;
    } catch (e) {
      PIN_MEM = '';
      if (String(e).indexOf('PIN salah') !== -1) return false;
      setPesanPin(String(e));
      return null;
    } finally {
      setMemeriksa(false);
    }
  };

  const toast = (msg, err) => { setSnack({ msg, err }); setTimeout(() => setSnack(null), 3500); };
  const load = () => { setLoading(true); server('getData').then(d => { setData(d); simpanCache(d); }).catch(e => toast('Gagal memuat data: ' + e, true)).finally(() => setLoading(false)); };
  useEffect(() => { if (!terkunci) load(); }, [terkunci]);

  const jalankan = (req, pesan, tutup = true) => {
    setSaving(true);
    return req.then(() => { if (tutup) setSheet(null); toast(pesan); load(); })
      .catch(e => toast('Gagal: ' + e, true)).finally(() => setSaving(false));
  };
  const simpan = f => {
    if (f.kategori === 'bayar') {
      return jalankan(f.id ? server('editPembayaran', f.id, f) : server('bayarCicilan', f), f.id ? 'Pembayaran diperbarui' : 'Pembayaran dicatat');
    }
    const req = !f.id ? server('simpanData', f) : f.kategori === 'hutang' ? server('editHutang', f.id, f) : server('editLogbook', f.id, f);
    jalankan(req, f.id ? 'Perubahan disimpan' : f.kategori === 'logbook' ? 'Catatan disimpan' : 'Pinjaman disimpan');
  };
  const hapus = f => f.kategori === 'bayar'
    ? jalankan(server('hapusPembayaran', f.id), 'Pembayaran dihapus')
    : f.kategori === 'hutang'
    ? jalankan(server('hapusHutang', f.id), 'Pinjaman dihapus')
    : jalankan(server('hapusLogbook', f.id), 'Catatan dihapus');
  const lunasi = h => jalankan(server('tandaiLunas', h.id), 'Pinjaman ' + h.nama + ' ditandai lunas');
  const lunasiSemua = g => jalankan(server('lunasiBanyak', g.items.map(h => h.id)), 'Semua pinjaman ' + g.nama + ' lunas');

  const judul = {
    beranda: ['Halo', new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})],
    logbook: ['Logbook','Catatan dan rutinitas berkala'],
    keuangan: ['Keuangan','Hutang dan piutang']
  }[tab];
  const fab = () => setSheet(tab === 'logbook' ? 'logbook' : tab === 'keuangan' ? 'hutang' : 'pilih');
  const d = data || { logbook: [], hutang: [] };
  const bukaDetail = h => setSheet({ detail: h });
  const bukaEdit = l => setSheet({ edit: l });
  const namaList = [...new Set(d.hutang.map(h => String(h.nama).trim()))].sort();
  const grupOrang = sheet && sheet.orang ? kelompokkan(d.hutang, sheet.lunas).find(g => g.key === sheet.orang) : null;

  return html`<div>
    ${terkunci && html`<${LayarPin} pesan=${pesanPin} memeriksa=${memeriksa} onMasuk=${masuk}/>`}
    <div className=${'app' + (terkunci ? ' terkunci-isi' : '')} aria-hidden=${terkunci ? 'true' : undefined}>
    <header className="appbar">
      <div><h1>${judul[0]}</h1><p>${judul[1]}</p></div>
      <button className="icon-btn" aria-label="Muat ulang" onClick=${load}><span className=${loading ? 'spin' : ''} style=${{display:'grid'}}><${Icon} n="refresh"/></span></button>
    </header>

    ${!data ? html`<div className="section">${[1,2,3,4].map(i => html`<div key=${i} className="skeleton"></div>`)}</div>`
      : tab === 'beranda' ? html`<${Beranda} data=${d} go=${setTab} openForm=${setSheet} onTapHutang=${bukaDetail} onTapLog=${bukaEdit}/>`
      : tab === 'logbook' ? html`<${Logbook} data=${d} onTap=${bukaEdit}/>`
      : html`<${Keuangan} data=${d} onTapOrang=${(key, lunas) => setSheet({ orang: key, lunas })}/>`}

    <button className="fab" onClick=${fab}><${Icon} n="plus"/>Tambah</button>

    <nav className="nav">
      ${[['beranda','home','Beranda'],['logbook','book','Logbook'],['keuangan','wallet','Keuangan']].map(([k, ic, lb]) =>
        html`<button key=${k} className=${tab === k ? 'on' : ''} aria-current=${tab === k ? 'page' : undefined} onClick=${() => { setTab(k); window.scrollTo(0,0); }}>
          <span className="pill"><${Icon} n=${ic}/></span>${lb}</button>`)}
    </nav>

    ${sheet && html`<${Sheet} onClose=${() => !saving && setSheet(null)}>
      ${sheet === 'pilih' ? html`<div><h3>Mau mencatat apa?</h3><div className="choice">
          <button onClick=${() => setSheet('logbook')}><span style=${{color:'var(--primary)'}}><${Icon} n="book" s=${26}/></span><div style=${{marginTop:10}}>Catatan</div><small>Servis, kegiatan, rutinitas</small></button>
          <button onClick=${() => setSheet('hutang')}><span style=${{color:'var(--green)'}}><${Icon} n="wallet" s=${26}/></span><div style=${{marginTop:10}}>Pinjaman</div><small>Hutang atau piutang</small></button>
        </div></div>`
      : sheet === 'logbook' ? html`<${FormLogbook} onSave=${simpan} saving=${saving}/>`
      : sheet === 'hutang' ? html`<${FormHutang} onSave=${simpan} saving=${saving} namaList=${namaList}/>`
      : sheet.hutangBaru ? html`<${FormHutang} prefill=${sheet.hutangBaru} onSave=${simpan} saving=${saving} namaList=${namaList}/>`
      : sheet.editHutang ? html`<${FormHutang} key=${sheet.editHutang.id} awal=${sheet.editHutang} onSave=${simpan} onDelete=${hapus} saving=${saving} namaList=${namaList}/>`
      : sheet.bayar ? html`<${FormBayar} pilihan=${d.hutang.filter(h => sheet.bayar.pilihan.indexOf(h.id) !== -1 && h.status !== 'Lunas')}
          idAwal=${sheet.bayar.idAwal} onSave=${simpan} saving=${saving}/>`
      : sheet.editBayar ? html`<${FormBayar} key=${sheet.editBayar.id} pilihan=${d.hutang.filter(h => h.id === sheet.editBayar.idPinjaman)}
          awal=${sheet.editBayar} onSave=${simpan} onDelete=${hapus} saving=${saving}/>`
      : sheet.orang ? html`<${Orang} g=${grupOrang} lunas=${sheet.lunas} saving=${saving} onTapItem=${bukaDetail}
          onTambah=${g => setSheet({ hutangBaru: { nama: g.nama, jenis: g.jenis } })} onLunasSemua=${lunasiSemua}
          onBayar=${g => setSheet({ bayar: { pilihan: g.items.map(h => h.id) } })}/>`
      : sheet.edit ? html`<${FormLogbook} key=${sheet.edit.id} awal=${sheet.edit} onSave=${simpan} onDelete=${hapus} saving=${saving}/>`
      : html`<${Detail} h=${sheet.detail} saving=${saving} onLunas=${() => lunasi(sheet.detail)} onEdit=${() => setSheet({ editHutang: sheet.detail })} onClose=${() => setSheet(null)}
          onBayar=${h => setSheet({ bayar: { pilihan: [h.id], idAwal: h.id } })} onEditBayar=${p => setSheet({ editBayar: p })}/>`}
    </${Sheet}>`}

    ${snack && !terkunci && html`<div className=${'snack' + (snack.err ? ' err' : '')} role="status">${snack.msg}</div>`}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
</script>
</body>
</html>
